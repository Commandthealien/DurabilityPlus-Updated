plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = "fabric-${minecraft_version}-${mod_version}"
group = mod_package

base {
    archivesName = mod_id
}

println "Java: ${System.getProperty('java.version')}, JVM: ${System.getProperty('java.vm.version')} (${System.getProperty('java.vendor')}), Arch: ${System.getProperty('os.arch')}"

repositories {
    maven {
        name = 'Cloth Config'
        url = 'https://maven.shedaniel.me/'
    }
    maven {
        name = 'Mod Menu'
        url = 'https://maven.terraformersmc.com/releases/'
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"

    implementation "net.fabricmc:fabric-loader:${loader_version}"

    // Keep this as implementation so it is available at compile time and runtime in dev.
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}+${minecraft_version}"

    implementation("me.shedaniel.cloth:cloth-config-fabric:${cloth_config_version}") {
        exclude group: "net.fabricmc.fabric-api"
    }

    implementation "com.terraformersmc:modmenu:${mod_menu_version}"
}

tasks.named('processResources', ProcessResources).configure {
    def replaceProperties = [
            minecraft_version:     minecraft_version,
            fabric_loader_version: loader_version,
            loom_version:          loom_version,
            id:                    mod_id,
            name:                  mod_name,
            version:               mod_version,
            description:           mod_description,
            group_id:              mod_package,
            fabric_version:        fabric_version,
            cloth_config_version:  cloth_config_version,
            mod_menu_version:      mod_menu_version
    ]

    inputs.properties replaceProperties

    filesMatching(["fabric.mod.json", "pack.mcmeta", "${mod_id}.mixins.json".toString()]) {
        expand replaceProperties + [project: project]
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
    it.options.encoding = 'UTF-8'
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }

    repositories {
        // Configure publishing repositories here.
    }
}